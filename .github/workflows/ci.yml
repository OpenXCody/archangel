name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_MAP_TOKEN: ci-placeholder

  # The suites that need a database: the schema built from nothing, sample
  # data, the five API suites and the device suite, against the built app.
  # Everything happens in scripts/ci-local.sh, so the same run can be made on
  # a developer's machine; this job only provides Postgres and a browser.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archangel_ci
      # No map key in CI: the map draws on a plain canvas.
      VITE_MAP_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Postgres client tools
        run: (command -v psql && command -v createdb) || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # From template0, so the database is empty whatever the image put in its
      # default one. PostGIS is on the server for when a migration wants it;
      # nothing uses it today.
      - name: Empty database
        run: createdb -h 127.0.0.1 -U postgres -T template0 archangel_ci
      - name: Schema from nothing, sample data, API suites, device suite
        run: bash scripts/ci-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suites
          path: |
            ci-results
            test-results
            playwright-report
          if-no-files-found: ignore
