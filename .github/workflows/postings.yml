# Brings employers' public job postings in as jobs, every day, without
# anyone's laptop: every employer in data/employers/boards.json is read
# through the intake runner (scripts/ingest/run.mjs postings) against the
# production database. It also starts by hand: Actions, "Postings", "Run
# workflow".
#
# One repository secret is needed, and nothing else:
#   INGEST_DATABASE_URL   the production database's connection string
#   (GitHub: Settings, Secrets and variables, Actions, New repository secret.
#   It is the secret the Ingest workflow uses.)
# Until it is set the run says so and ends green: a run that is red every day
# teaches people not to look.
#
# Each employer is a run of its own. A site that refuses (a 403, a 429, a
# challenge page, a reset) ends that employer for the day and is recorded; one
# that does not answer is tried again the next day; neither turns the run red.
# The run is red only when something needs a person: a feed whose shape
# changed, or an error of ours. The report (the requests made by platform,
# which boards were listed in full, which were cut short and why, and what
# each employer's run read, kept and changed) is kept as the run's artifact,
# and Admin Tools, Activity, "Postings" shows the same.
#
# A day's run is under an hour. Twenty minutes of it is Workday: that
# platform is given 300 requests a run across all of its boards, four seconds
# apart whichever board they are for, spent where they are most needed; the
# rest are taken up at the next run (scripts/ingest/README.md, "A platform's
# budget"). The other boards' listings take about a quarter of an hour; while
# boards are first read in, their texts add up to half an hour more (the 27
# employers added in November 2026 took 29 minutes the first time).
#
# Workday's boards alone are read three more times a day (03:23, 15:23 and
# 21:23 UTC), each with the same budget, six hours apart: with the boards the
# registry names, one run a day took weeks to list them all once, and a board
# the budget never reached had no run at all. A day is then at most 1,200
# requests to that platform, never more than 300 in an hour. The other boards
# are read once a day, in the 09:23 run.
#
# By hand: mode "rehearse" reads every board, does everything inside
# transactions that are rolled back, and reports what it would do; "undo"
# takes one run back, by its number in the report; "only" names employers by
# their slug in the registry, with commas between; "system" names hiring
# systems the same way (workday), and only their boards are read.
name: Postings
on:
  schedule:
    # 09:23 UTC: before the working day in every US time zone.
    - cron: '23 9 * * *'
    # Workday's boards alone, between the daily runs (see above).
    - cron: '23 3,15,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: apply reads the boards and brings the jobs in line; rehearse changes nothing; undo takes a run back
        required: true
        default: apply
        type: choice
        options:
          - apply
          - rehearse
          - undo
      only:
        description: 'Employers to read, by slug, with commas between (all of them when empty)'
        required: false
        type: string
      system:
        description: 'Hiring systems to read, with commas between (all of them when empty)'
        required: false
        type: string
      run:
        description: 'For undo: the number of the run to take back'
        required: false
        type: string

# One at a time, and never beside a run of the Ingest workflow.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  postings:
    runs-on: ubuntu-latest
    # A day's run takes under an hour, a Workday run about twenty minutes; this is for a database or a runner that is
    # slow, not for a longer run.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      MODE: ${{ inputs.mode || 'apply' }}
      ONLY: ${{ inputs.only }}
      # The runs between the daily ones read Workday's boards and nothing else.
      SYSTEM: ${{ inputs.system || (github.event.schedule == '23 3,15,21 * * *' && 'workday') || '' }}
      RUN_NUMBER: ${{ inputs.run }}
    steps:
      - name: The database is named
        id: database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Postings were not read::The repository secret INGEST_DATABASE_URL is not set (Settings, Secrets and variables, Actions). Nothing was read and nothing was written."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The host is what --yes-this-database must name. It is masked in the log like the secret it came from.
          HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
          echo "::add-mask::$HOST"
          echo "DATABASE_HOST=$HOST" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.database.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.database.outputs.ready == 'true'
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: steps.database.outputs.ready == 'true'
      - name: The registry is usable
        if: steps.database.outputs.ready == 'true'
        run: node scripts/ingest/run.mjs postings --check
      - name: Read every employer's board and bring the jobs in line
        if: steps.database.outputs.ready == 'true' && env.MODE == 'apply'
        run: node scripts/ingest/run.mjs postings ${ONLY:+--only "$ONLY"} ${SYSTEM:+--system "$SYSTEM"} --yes-this-database "$DATABASE_HOST" --report postings-report.txt
      - name: Rehearse
        if: steps.database.outputs.ready == 'true' && env.MODE == 'rehearse'
        run: node scripts/ingest/run.mjs postings --rehearse ${ONLY:+--only "$ONLY"} ${SYSTEM:+--system "$SYSTEM"} --yes-this-database "$DATABASE_HOST" --report postings-report.txt
      - name: Undo
        if: steps.database.outputs.ready == 'true' && env.MODE == 'undo'
        run: node scripts/ingest/run.mjs undo "$RUN_NUMBER" --yes-this-database "$DATABASE_HOST" --report postings-report.txt
      - name: What the run did
        if: always() && steps.database.outputs.ready == 'true'
        run: |
          # The first lines of the report: how many employers, requests and refusals, how long, then one line per employer.
          if [ -f postings-report.txt ]; then
            { echo '```'; sed -n '1,40p' postings-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.database.outputs.ready == 'true'
        with:
          name: postings-${{ env.MODE }}-${{ github.run_number }}
          path: postings-report.txt
          if-no-files-found: warn
