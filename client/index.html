<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Service worker cleanup: unregister any SW from prior PWA-enabled builds
         and clear the Workbox caches. Safe to run every load — a no-op when
         no SW is registered. Keep until all prior SWs have expired in the wild. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
          }
        } catch (_) { /* ignore */ }
      })();
    </script>
    
    <!-- Theme: applied before first paint so the page never flashes the other
         theme. Mirrors client/src/lib/theme.ts (key and values must match). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('archangel.theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (_) { /* storage unavailable: stay on the default theme */ }
      })();
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Archangel" />
    
    <!-- SEO -->
    <meta name="description" content="Archangel - US Manufacturing Workforce Intelligence Platform. Explore companies, factories, careers, and skills." />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Fonts: Oxanium is imported from globals.css; preconnect so it starts early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>Archangel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
